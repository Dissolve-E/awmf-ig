name: FHIR Validation

on:
  push:
    branches:
      - main
      - master
      - staging
      - fhir-r6-ballot5
  pull_request:
    branches:
      - main
      - master
      - staging

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  LANG: "en_US.UTF-8"

jobs:

  fsh-fhir-validation:
    runs-on: ubuntu-latest
    steps:

        # locale must be set explicitly, otherwise fhir validator 5.7.75 fails
      - name: set locale
        run: |
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install fsh-validator>=0.1.3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install fsh-sushi
        run: npm install -g fsh-sushi

      # Use the glichtner fork validator (patched for R6 ballot5) instead of
      # the official release, which does not support ballot5 yet.
      - name: Load validator
        run: curl -fL https://github.com/glichtner/org.hl7.fhir.core/releases/latest/download/validator_cli.jar -o ./validator_cli.jar

      # Seeds hl7.fhir.r6.core/expansions#6.0.0-ballot5 from hl7.org (ballot5
      # is not on the package registries yet) and fixes the packages' web
      # location and materialized extension slicing; see script for details.
      - name: Install FHIR R6 ballot5 packages into local FHIR cache
        run: ./download-fhir-r6-ballot5.sh

      - name: Install EBM IG continuous build
        run: ./download-ebm-ig.sh

      - name: Execute validator
        run: fsh-validator --all

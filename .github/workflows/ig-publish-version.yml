name: Publish IG Version

# Publishes the version that publication-request.json describes at a release tag, with
# the IG Publisher's -go-publish process (see RELEASING.md). Without `publish` the run is
# a dry run: it builds and stages the publication and lists what would change on
# fhir.awmf.org, but uploads nothing.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Release tag (v<version>, e.g. v0.3.0)'
        required: true
        type: string
      publish:
        description: 'Upload to fhir.awmf.org and create the GitHub release (otherwise a dry run)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ig-publish-version
  cancel-in-progress: false

env:
  # Publish with a fixed Publisher release; change it deliberately.
  PUBLISHER_VERSION: '3.0.2'
  SSH_HOST: register.awmf.org
  SSH_TARGET: awmf_ig_publisher@register.awmf.org
  WEB_PATH: ./awmf.ig

jobs:
  # Approval of the `publication` environment (Settings > Environments) gates every
  # publication. Dry runs skip this job.
  authorize:
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: publication
    steps:
      - env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: echo "Publication of $RELEASE_REF approved"

  publish-version:
    needs: authorize
    if: ${{ !cancelled() && (needs.authorize.result == 'success' || needs.authorize.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      JAVA_TOOL_OPTIONS: '-Xmx6g'

    steps:
      # A milestone needs more than 20 GB: the website, the source with its build, and the
      # copies that -go-publish builds. The workflow uses none of the preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_ref }}
          path: source
          fetch-depth: 0

      - name: Check the release tag
        id: release
        working-directory: source
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          version="$(jq -er .version publication-request.json)"
          if [[ "$RELEASE_REF" != "v$version" ]]; then
            echo "::error::publication-request.json is for $version, so the tag must be v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$RELEASE_REF is not on main"
            exit 1
          fi
          path="$(jq -er .path publication-request.json)"
          {
            echo "version=$version"
            echo "mode=$(jq -er .mode publication-request.json)"
            echo "path=$path"
            echo "canonical=${path%/*}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.AWMF_IG_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/awmf_ig_publisher
          chmod 600 ~/.ssh/awmf_ig_publisher
          ssh-keyscan -p 221 "$SSH_HOST" >> ~/.ssh/known_hosts
          printf 'Host %s\n  Port 221\n  IdentityFile ~/.ssh/awmf_ig_publisher\n' "$SSH_HOST" >> ~/.ssh/config

      # -go-publish needs the complete website: it updates the history, the feeds and the
      # publish boxes of earlier versions. ci-build/ belongs to ig-publish.yml.
      - name: Download the published website
        id: website
        run: |
          mkdir -p site
          rsync -a --delete --exclude '/ci-build/' "$SSH_TARGET:$WEB_PATH/" site/
          if [[ -f site/package-list.json ]]; then
            echo "package_list_sha256=$(sha256sum site/package-list.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          fi
          du -sh site

      - name: Build and stage the publication
        uses: docker://hl7fhir/ig-publisher-base@sha256:39509f4138197f0b93a99ed3ae00e6dce2bbd76df1a2e4e2bd6dec4180dc34b5
        env:
          PUBLISHER_VERSION: ${{ env.PUBLISHER_VERSION }}
        with:
          args: ./source/publish-version.sh --web site --work work

      - name: List the changes on fhir.awmf.org
        run: |
          rsync -a --dry-run --itemize-changes --exclude '/ci-build/' site/ "$SSH_TARGET:$WEB_PATH/" > upload-changes.txt
          {
            echo "### Files to upload to $WEB_PATH"
            echo
            echo "| Folder | New | Changed |"
            echo "| --- | ---: | ---: |"
            awk '$1 ~ /^<f/ {
                   path = substr($0, index($0, " ") + 1)
                   n = split(path, parts, "/")
                   folder = n > 1 ? parts[1] "/" : "(root)"
                   if ($1 ~ /\+\+\+\+\+\+\+\+\+$/) added[folder]++; else changed[folder]++
                   folders[folder] = 1
                 }
                 END { for (f in folders) printf "| %s | %d | %d |\n", f, added[f], changed[f] }' upload-changes.txt | sort
            echo
            echo "Nothing is deleted on the server. The full list is in the review artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-review-${{ inputs.release_ref }}
          path: |
            source/output/qa.html
            source/output/qa.json
            work/zips/*.log
            work/zips/*.txt
            site/package-list.json
            upload-changes.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to fhir.awmf.org
        if: inputs.publish
        env:
          EXPECTED_SHA256: ${{ steps.website.outputs.package_list_sha256 }}
        run: |
          # Stop if the server changed since the download: the staged history would drop that change.
          rsync -a "$SSH_TARGET:$WEB_PATH/package-list.json" server-package-list.json 2>/dev/null || true
          actual=""
          if [[ -f server-package-list.json ]]; then
            actual="$(sha256sum server-package-list.json | cut -d ' ' -f 1)"
          fi
          if [[ "$actual" != "$EXPECTED_SHA256" ]]; then
            echo "::error::package-list.json on the server changed during the build; run the workflow again"
            exit 1
          fi
          # Upload the version folders and pages first and the files that list the new
          # version last. Never delete: the server keeps everything that was published.
          rsync -a --exclude '/ci-build/' --exclude '/package-list.json' --exclude '/history.html' \
            --exclude '/package-feed.xml' --exclude '/publication-feed.xml' --exclude '/package-registry.json' \
            site/ "$SSH_TARGET:$WEB_PATH/"
          rsync -a --exclude '/ci-build/' site/ "$SSH_TARGET:$WEB_PATH/"

      - name: Check the publication on fhir.awmf.org
        if: inputs.publish
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MODE: ${{ steps.release.outputs.mode }}
          PUBLICATION_PATH: ${{ steps.release.outputs.path }}
          CANONICAL: ${{ steps.release.outputs.canonical }}
        run: |
          base="${CANONICAL/#http:/https:}"
          version_base="${PUBLICATION_PATH/#http:/https:}"
          curl -fsSL "$base/package-list.json" |
            jq -e --arg v "$VERSION" --arg p "$PUBLICATION_PATH" --arg m "$MODE" \
              'any(.list[]; .version == $v and .path == $p and ($m == "working" or .current == true))' > /dev/null
          for url in "$version_base/index.html" "$version_base/package.tgz" "$base/history.html" "$base/package-feed.xml"; do
            curl -fsSL -o /dev/null "$url"
          done
          echo "Published $VERSION at $version_base" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_ref }}
          name: ${{ steps.release.outputs.version }}
          prerelease: ${{ steps.release.outputs.mode == 'working' || contains(steps.release.outputs.version, '-') }}
          body: |
            Published at ${{ steps.release.outputs.path }} (${{ steps.release.outputs.mode }} release).

            - History: ${{ steps.release.outputs.canonical }}/history.html
            - Package: ${{ steps.release.outputs.path }}/package.tgz

            The EBM dependencies are attached with the build date and checksum in build-info.json.
          files: |
            site/${{ steps.release.outputs.version }}/package.tgz
            source/input-cache/dependency-packages/*.tgz
            source/input-cache/dependency-packages/build-info.json
